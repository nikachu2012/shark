# ci.yml — 押すたびに、4つの機種で作って試し、できたものを置いておく
#
# 作るのに要るのは C++17 の翻訳器だけ（外部ライブラリなし）。
# 日本語の字を出す FreeType は任意なので、ここでは**元から静的に作って**繋ぐ。
# 相手の機械に何も入れなくてよいことも、ここで確かめている。
#
# できたものは、GitHub の実行ごとの「Artifacts」から落とせる（14 日で消える）。
# 名札（タグ）を押したときの配りかたは release.yml。包み方はどちらも
# tools/package.sh で同じ。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: 作って試す（${{ matrix.name }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest,  name: macos-arm64 }
          - { os: macos-13,      name: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4

      # FreeType を静的に作る（一度作れば、次からは取っておいたものを使う）
      - name: FreeType を用意する
        id: ft
        run: sh tools/freetype_static.sh

      - name: 作る
        run: make -j3 $(sh tools/freetype_static.sh --flags)

      - name: 試す
        run: make test $(sh tools/freetype_static.sh --flags)

      - name: 説明を作って、実装と突き合わせる
        run: make docs

      - name: 説明の中の例を、ぜんぶ動かす
        run: make docs-check

      # できたものは、この実行の「Artifacts」から落とせる（配るときと同じ包み）
      - name: 包む
        run: sh tools/package.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: shark-${{ matrix.name }}
          path: dist/shark-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: 作って試す（windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: FreeType を静的に作る
        run: tools\build_win.bat freetype
        shell: cmd

      - name: 作る
        run: tools\build_win.bat
        shell: cmd

      # tests/run.sh は sh の台本。Windows の runner には Git の sh が入っている
      - name: 試す
        run: sh tests/run.sh
        shell: bash

      - name: 包む
        run: sh tools/package.sh windows-x86_64
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: shark-windows-x86_64
          path: dist/shark-windows-x86_64.*
          if-no-files-found: error
          retention-days: 14
